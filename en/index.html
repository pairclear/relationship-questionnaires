<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1714'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23c0613f'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#faf7f2; --card:#f2ede5; --field:#ffffff; --ink:#1a1714; --muted:#6b645c; --line:#e4ddd2;
  --accent:#b85c3c; --accent-soft:#f3e2d9; --btn:#1a1714; --btn-ink:#faf7f2; --warn:#8a3b1f; --warn-bg:#fbe9df;
  --serif:"Iowan Old Style","Charter","Georgia","Cambria","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130f; --card:#211e19; --field:#1b1814; --ink:#efe9df; --muted:#a39b8f; --line:#332e27;
    --accent:#d9774f; --accent-soft:#3a271e; --btn:#efe9df; --btn-ink:#15130f; --warn:#f2b597; --warn-bg:#3a2219;
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --card:#211e19; --field:#1b1814; --ink:#efe9df; --muted:#a39b8f; --line:#332e27;
  --accent:#d9774f; --accent-soft:#3a271e; --btn:#efe9df; --btn-ink:#15130f; --warn:#f2b597; --warn-bg:#3a2219;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans)}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:20px;text-decoration:none}
.mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--ink)}
.mark i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.langs{display:flex;gap:4px}
.langs button,.tabs button{font:inherit;font-size:14px;background:none;border:1px solid transparent;color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"],.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--line);background:var(--card)}
main{padding:40px 0 56px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:0}
h1{font-size:clamp(34px,6vw,54px)}
h2{font-size:clamp(24px,4vw,32px);margin-top:56px}
h3{font-size:18px}
.lead{font-size:19px;max-width:660px;margin:18px 0 0}
.muted{color:var(--muted)} .small{font-size:14px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:14px 18px;margin:24px 0 0;font-size:15px;max-width:760px}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:22px;padding:0;list-style:none}
.rules li{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.rules b{display:block;font-family:var(--serif);font-size:18px;margin-bottom:4px}
.rules span{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:6px;margin:18px 0 10px;flex-wrap:wrap}
pre{background:var(--field);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;white-space:pre-wrap;word-wrap:break-word;font:14px/1.55 var(--mono);max-height:440px;overflow:auto;margin:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.btn{font:inherit;font-weight:600;font-size:16px;background:var(--btn);color:var(--btn-ink);border:1px solid var(--btn);padding:11px 18px;border-radius:999px;cursor:pointer}
.btn:focus-visible,button:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-top:10px}
summary{cursor:pointer;font-weight:600}
summary small{font-weight:400;color:var(--muted)}
details q{display:block;font-family:var(--serif);font-size:18px;margin:12px 0;quotes:"\201C" "\201D"}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.cols ul{margin:6px 0 0;padding-left:20px;font-size:15px}
.ok{color:#2f7a4a} .no{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
footer{border-top:1px solid var(--line);padding:28px 0 40px;font-size:14px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:28px}
.qcard{display:block;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;cursor:pointer}
.qcard:hover{border-color:var(--accent)}
.qcard b{display:block;font-family:var(--serif);font-size:19px;line-height:1.25;margin-bottom:6px}
.qcard span{font-size:15px;color:var(--muted)}
.back{font:inherit;font-size:15px;background:none;border:0;color:var(--muted);padding:0;cursor:pointer;margin-bottom:18px}
.item{border-top:1px solid var(--line);padding:18px 0}
.item p{margin:0 0 10px;font-size:18px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;background:var(--field)}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label:has(input:checked){background:var(--accent);border-color:var(--accent);color:#fff}
.opts label:has(input:focus-visible){outline:3px solid var(--accent-soft)}
.progress{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2;font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.part{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-top:14px}
.part h3{display:flex;justify-content:space-between;gap:12px}
.part h3 span{font-family:var(--sans);font-size:15px;color:var(--muted);font-weight:400}
.part .bar{height:10px;margin:10px 0 12px}
.part p{margin:0}
.safety{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:16px 20px;margin-top:20px}
ol.reflect{padding-left:22px} ol.reflect li{margin:6px 0}
.links a{display:inline-block;margin:4px 14px 4px 0}
@media print{header.top,.back,.row,footer,.langs{display:none} body{background:#fff;color:#000}}
</style>

Before solving anything, agree on a short pause rule for arguments and a time to talk when both are calm.", "ru": "Напряжённая неделя. Прежде чем что-то решать, договоритесь о правиле паузы в споре и о времени, когда обоим спокойно поговорить."}}], "items": [{"id": "cp1", "sub": "connection", "rev": false, "en": "We had at least one conversation that wasn't about chores, kids or logistics.", "ru": "У нас был хотя бы один разговор не о быте, детях и делах."}, {"id": "cp2", "sub": "connection", "rev": false, "en": "I felt my partner was interested in how my week went.", "ru": "Я чувствовал(а), что партнёру интересно, как прошла моя неделя."}, {"id": "cp3", "sub": "connection", "rev": false, "en": "We laughed together.", "ru": "Мы вместе смеялись."}, {"id": "cp4", "sub": "connection", "rev": false, "en": "I felt comfortable asking my partner for something I needed.", "ru": "Мне было спокойно попросить партнёра о том, что мне нужно."}, {"id": "cp5", "sub": "friction", "rev": false, "en": "Small things turned into arguments.", "ru": "Мелочи превращались в споры."}, {"id": "cp6", "sub": "friction", "rev": false, "en": "I held back something I wanted to say to avoid a fight.", "ru": "Я промолчал(а) о том, что хотел(а) сказать, чтобы не было ссоры."}, {"id": "cp7", "sub": "friction", "rev": false, "en": "After a disagreement, one of us stayed cold for a long time.", "ru": "После разногласия кто-то из нас долго оставался холодным."}, {"id": "cp8", "sub": "friction", "rev": true, "en": "When we disagreed, we managed to make up the same day.", "ru": "Когда мы не соглашались, нам удавалось помириться в тот же день."}], "reflect": {"en": ["What was the best moment between you this week?", "What is one thing you'd like more of next week?", "Is there a topic you're avoiding? What makes it hard to raise?"], "ru": ["Какой момент между вами был лучшим на этой неделе?", "Чего бы тебе хотелось больше на следующей неделе?", "Есть ли тема, которую ты обходишь? Что мешает её поднять?"]}, "links": {"en": [{"title": "All PairClear quizzes", "url": "https://pairclear.com/en/tests/"}], "ru": [{"title": "Все тесты PairClear", "url": "https://pairclear.com/ru/tests/"}]}, "validated": false, "licence": "CC BY 4.0"}, {"id": "conflict-pattern", "version": "1.0", "title": {"en": "One fight or a pattern? How we argue", "ru": "Одна ссора или система? Как мы ссоримся"}, "intro": {"en": "About how arguments go between you: whether the same fight repeats, how it escalates, and whether you find a way back. Two questions are about safety; if either applies, the result will show where to get help.", "ru": "О том, как у вас проходят ссоры: повторяется ли одно и то же, как разгорается и находите ли вы путь обратно. Два вопроса о безопасности; если что-то из этого есть, в результате будет, куда обратиться."}, "timeframe": {"en": "the last 3 months", "ru": "последние 3 месяца"}, "subscales": [{"id": "repeat", "en": "Repeating loop", "ru": "Повторяющийся круг", "low": {"en": "Arguments don't seem to run in one loop.", "ru": "Не похоже, что ссоры идут по одному кругу."}, "mid": {"en": "Some arguments repeat. Try naming the loop together, as 'us against the loop', not 'me against you'.", "ru": "Некоторые ссоры повторяются. Попробуйте вместе назвать этот круг: «мы против круга», а не «я против тебя»."}, "high": {"en": "The same argument keeps coming back. That usually means the topic underneath hasn't been heard yet. A couples counsellor can help you get out of the loop.", "ru": "Одна и та же ссора возвращается. Обычно это значит, что тема под ней ещё не услышана. Выйти из круга может помочь семейный консультант."}}, {"id": "escalation", "en": "Escalation", "ru": "Эскалация", "low": {"en": "Arguments rarely get out of hand.", "ru": "Ссоры редко выходят из-под контроля."}, "mid": {"en": "Sometimes it gets heated. Agree in a calm moment on a pause signal and how long the pause lasts.", "ru": "Иногда разгорается. Договоритесь в спокойный момент о сигнале паузы и о том, сколько она длится."}, "high": {"en": "Arguments often get heated or personal. A pause rule helps; if it doesn't, it's worth getting outside help.", "ru": "Ссоры часто разгораются или переходят на личности. Помогает правило паузы; если не помогает, стоит обратиться за помощью."}}, {"id": "repair", "en": "Repair", "ru": "Примирение", "low": {"en": "It's hard to find a way back after an argument. Small repair attempts (a joke, a touch, 'let's start over') count.", "ru": "После ссоры трудно найти путь обратно. Маленькие попытки примирения (шутка, прикосновение, «давай заново») считаются."}, "mid": {"en": "You sometimes find a way back. Notice what worked last time.", "ru": "Иногда путь обратно находится. Заметьте, что сработало в прошлый раз."}, "high": {"en": "You usually find your way back. That's a real strength.", "ru": "Обычно вы находите путь обратно. Это настоящая опора."}}], "items": [{"id": "cf1", "sub": "repeat", "rev": false, "en": "We argue about the same topic again and again.", "ru": "Мы снова и снова ссоримся из-за одной и той же темы."}, {"id": "cf2", "sub": "repeat", "rev": false, "en": "I can predict how an argument will go from its first sentence.", "ru": "По первой фразе я могу предсказать, как пойдёт ссора."}, {"id": "cf3", "sub": "repeat", "rev": false, "en": "Old arguments are brought into new ones.", "ru": "В новые ссоры приносятся старые."}, {"id": "cf4", "sub": "escalation", "rev": false, "en": "Arguments turn into criticism of who the other person is, not what they did.", "ru": "Ссоры превращаются в критику того, какой человек, а не того, что он сделал."}, {"id": "cf5", "sub": "escalation", "rev": false, "en": "One of us shouts, insults or mocks the other.", "ru": "Кто-то из нас кричит, оскорбляет или высмеивает другого."}, {"id": "cf6", "sub": "escalation", "rev": false, "en": "One of us shuts down or leaves and won't talk for a long time.", "ru": "Кто-то из нас закрывается или уходит и долго не разговаривает."}, {"id": "cf7", "sub": "repair", "rev": false, "en": "After an argument, one of us makes a step towards the other.", "ru": "После ссоры кто-то из нас делает шаг навстречу."}, {"id": "cf8", "sub": "repair", "rev": false, "en": "We can later talk calmly about what happened.", "ru": "Потом мы можем спокойно поговорить о том, что случилось."}, {"id": "cf8b", "sub": "repair", "rev": false, "en": "In the middle of an argument, one of us can soften it (a joke, a touch, 'let's start over') and the other accepts it.", "ru": "Посреди ссоры кто-то из нас может смягчить её (шутка, прикосновение, «давай заново»), и другой это принимает."}, {"id": "cf9", "sub": null, "flag": "safety", "rev": false, "en": "I feel afraid of my partner during or after arguments.", "ru": "Я боюсь партнёра во время или после ссор."}, {"id": "cf10", "sub": null, "flag": "safety", "rev": false, "en": "My partner controls my money, phone or who I can see, or threatens me.", "ru": "Партнёр контролирует мои деньги, телефон или с кем мне видеться, или угрожает мне."}], "reflect": {"en": ["What is the argument really about, underneath the topic?", "What do you need from your partner at the moment it starts to escalate?", "What helped you make up the last time it worked?"], "ru": ["О чём на самом деле ссора, если заглянуть под тему?", "Что тебе нужно от партнёра в момент, когда всё начинает разгораться?", "Что помогло помириться в последний раз, когда получилось?"]}, "links": {"en": [{"title": "Quiz: Am I the problem?", "url": "https://pairclear.com/en/tests/am-i-the-problem/"}], "ru": [{"title": "Тест: конфликт или система?", "url": "https://pairclear.com/ru/tests/konflikt-ili-sistema/"}]}, "validated": false, "licence": "CC BY 4.0"}, {"id": "contact-changes", "version": "1.0", "title": {"en": "What changed in how we keep in touch", "ru": "Что изменилось в нашем общении"}, "intro": {"en": "For when you feel a partner has become more distant. These questions are about what actually changed between you, not about what your partner feels: only they can answer that.", "ru": "Для момента, когда кажется, что партнёр отдаляется. Вопросы о том, что реально изменилось между вами, а не о том, что чувствует партнёр: на это может ответить только он сам."}, "timeframe": {"en": "the last month, compared with before", "ru": "последний месяц по сравнению с тем, что было раньше"}, "subscales": [{"id": "change", "en": "Change in contact", "ru": "Изменения в общении", "low": {"en": "Few visible changes. The distance you feel may be about something not yet said; asking directly is often easier than guessing.", "ru": "Видимых изменений немного. Ощущение дистанции может быть связано с чем-то несказанным; прямой вопрос часто проще, чем догадки."}, "mid": {"en": "Some things have changed. Pick one concrete change and ask about it calmly, without a conclusion attached.", "ru": "Кое-что изменилось. Выберите одно конкретное изменение и спокойно спросите о нём, не добавляя вывод."}, "high": {"en": "A lot has changed in how you keep in touch. That deserves a direct conversation about what is going on for both of you. Changes have many possible causes: stress, work, health, doubts.", "ru": "Многое изменилось в том, как вы общаетесь. Это повод для прямого разговора о том, что происходит у каждого. У изменений много возможных причин: стресс, работа, здоровье, сомнения."}}, {"id": "worry", "en": "How much it takes from me", "ru": "Сколько это у меня забирает", "low": {"en": "It doesn't take much of your attention. Good: you have room to think clearly.", "ru": "Это не забирает много внимания. Хорошо: есть место, чтобы думать ясно."}, "mid": {"en": "It takes a noticeable part of your attention. Try writing down facts separately from interpretations.", "ru": "Это заметно занимает мысли. Попробуй записывать факты отдельно от интерпретаций."}, "high": {"en": "It takes a lot of your attention and energy. Whatever happens next, it may help to talk to someone you trust, or a psychologist, about how you are.", "ru": "Это забирает много внимания и сил. Что бы ни было дальше, может помочь разговор о том, как ты, с близким человеком или психологом."}}], "items": [{"id": "cc1", "sub": "change", "rev": false, "en": "My partner starts conversations or texts less often than before.", "ru": "Партнёр реже, чем раньше, первым пишет или начинает разговор."}, {"id": "cc2", "sub": "change", "rev": false, "en": "Plans together are made later, vaguer or get cancelled more than before.", "ru": "Совместные планы строятся позже, размытее или отменяются чаще, чем раньше."}, {"id": "cc3", "sub": "change", "rev": false, "en": "Replies to me are shorter or slower than they used to be.", "ru": "Ответы мне стали короче или медленнее, чем были."}, {"id": "cc4", "sub": "change", "rev": false, "en": "We talk less about the future (holidays, plans, 'next year').", "ru": "Мы меньше говорим о будущем (отпуск, планы, «в следующем году»)."}, {"id": "cc5", "sub": "change", "rev": true, "en": "When I bring up something important, my partner engages with it.", "ru": "Когда я поднимаю что-то важное, партнёр в это включается."}, {"id": "cc6", "sub": "worry", "rev": false, "en": "I check my phone waiting for a message.", "ru": "Я проверяю телефон в ожидании сообщения."}, {"id": "cc7", "sub": "worry", "rev": false, "en": "I replay conversations looking for signs of what's wrong.", "ru": "Я прокручиваю разговоры в голове, ища признаки того, что не так."}, {"id": "cc8", "sub": "worry", "rev": false, "en": "I avoid asking directly because I'm afraid of the answer.", "ru": "Я не спрашиваю прямо, потому что боюсь ответа."}], "reflect": {"en": ["Which change bothers you most? Describe it as a fact, without a conclusion.", "What else could explain it, apart from your first guess?", "What would you want to ask your partner, and what would you need to hear?"], "ru": ["Какое изменение беспокоит больше всего? Опиши его как факт, без вывода.", "Чем ещё это можно объяснить, кроме первой догадки?", "О чём ты хотел(а) бы спросить партнёра и что тебе важно услышать?"]}, "links": {"en": [{"title": "Quiz: Is she losing interest?", "url": "https://pairclear.com/en/tests/is-she-losing-interest/"}, {"title": "Quiz: Is he losing interest?", "url": "https://pairclear.com/en/tests/is-he-losing-interest/"}], "ru": [{"title": "Тест: она отдаляется?", "url": "https://pairclear.com/ru/tests/ona-otdalyaetsya/"}]}, "validated": false, "licence": "CC BY 4.0"}, {"id": "effort-balance", "version": "1.0", "title": {"en": "Who carries the relationship: effort balance", "ru": "Кто тянет отношения: баланс вклада"}, "intro": {"en": "About the early or undefined stage, when you are not sure both of you are putting in the same. It looks at what each of you does, not at intentions.", "ru": "Для ранней или неопределённой стадии, когда непонятно, вкладываетесь ли вы одинаково. Смотрим на то, что каждый делает, а не на намерения."}, "timeframe": {"en": "the last 4 weeks", "ru": "последние 4 недели"}, "subscales": [{"id": "imbalance", "en": "Imbalance of effort", "ru": "Перекос вклада", "low": {"en": "Effort looks fairly shared.", "ru": "Вклад выглядит примерно общим."}, "mid": {"en": "You do noticeably more in some areas. Try stepping back once and see what happens, without testing or punishing.", "ru": "В чём-то ты делаешь заметно больше. Попробуй один раз не брать инициативу и посмотри, что будет, без проверок и наказаний."}, "high": {"en": "Most of the effort seems to come from you. That's worth naming directly: what you want, and what you'd need from the other person to keep going.", "ru": "Похоже, большая часть усилий идёт от тебя. Это стоит назвать прямо: чего ты хочешь и что тебе нужно от другого человека, чтобы продолжать."}}, {"id": "clarity", "en": "Clarity between us", "ru": "Ясность между нами", "low": {"en": "There is little clarity about what this is. You are allowed to ask.", "ru": "Ясности о том, что между вами, мало. Спрашивать можно."}, "mid": {"en": "Some things are clear, some are not. Which question would you most like answered?", "ru": "Что-то понятно, что-то нет. На какой вопрос тебе больше всего хочется получить ответ?"}, "high": {"en": "You mostly know where you stand.", "ru": "В основном ты понимаешь, где вы находитесь."}}], "items": [{"id": "eb1", "sub": "imbalance", "rev": false, "en": "I am the one who suggests meeting.", "ru": "Встретиться предлагаю я."}, {"id": "eb2", "sub": "imbalance", "rev": false, "en": "If I don't write first, we don't talk for days.", "ru": "Если я не напишу первым(ой), мы не общаемся по несколько дней."}, {"id": "eb3", "sub": "imbalance", "rev": false, "en": "I adjust my plans to fit the other person, and it rarely goes the other way.", "ru": "Я подстраиваю свои планы под другого человека, а наоборот бывает редко."}, {"id": "eb4", "sub": "imbalance", "rev": false, "en": "I ask more questions about their life than they ask about mine.", "ru": "Я задаю больше вопросов о его/её жизни, чем он(а) о моей."}, {"id": "eb5", "sub": "imbalance", "rev": true, "en": "The other person keeps promises about time together.", "ru": "Другой человек выполняет обещания о совместном времени."}, {"id": "eb6", "sub": "clarity", "rev": false, "en": "We have talked about what we are to each other.", "ru": "Мы говорили о том, кто мы друг другу."}, {"id": "eb7", "sub": "clarity", "rev": false, "en": "I know whether I am introduced to their friends and family, and why.", "ru": "Я знаю, знакомят ли меня с друзьями и семьёй, и почему."}, {"id": "eb8", "sub": "clarity", "rev": true, "en": "I'm afraid that asking 'what are we' will end things.", "ru": "Я боюсь, что вопрос «кто мы друг другу» всё закончит."}], "reflect": {"en": ["What would 'enough effort' from the other side look like, concretely?", "What are you afraid will happen if you stop carrying it for a week?", "What would you tell a friend in the same situation?"], "ru": ["Как конкретно выглядел бы «достаточный вклад» с другой стороны?", "Чего ты боишься, если на неделю перестанешь тянуть?", "Что бы ты сказал(а) другу или подруге в такой же ситуации?"]}, "links": {"en": [{"title": "Article: Texts every day but never makes plans", "url": "https://pairclear.com/en/mixed-signals/texts-every-day-no-plans/"}], "ru": [{"title": "Тест: он вкладывается или удерживает?", "url": "https://pairclear.com/ru/tests/on-vkladyvaetsya-ili-uderzhivaet/"}]}, "validated": false, "licence": "CC BY 4.0"}, {"id": "relationship-clarity", "version": "1.0", "title": {"en": "Are we together or not? Relationship clarity", "ru": "Мы вместе или нет? Ясность в отношениях"}, "intro": {"en": "For a 'situationship': you meet, maybe sleep together, but nobody has said what it is. These questions look at how much is clear between you and how the uncertainty sits with you.", "ru": "Для «неопределённых отношений»: вы встречаетесь, может быть, спите вместе, но никто не сказал, что это. Вопросы о том, сколько между вами ясности и как тебе с неопределённостью."}, "timeframe": {"en": "since you started seeing each other", "ru": "с тех пор как вы начали видеться"}, "subscales": [{"id": "signals", "en": "Clear signals", "ru": "Ясные сигналы", "low": {"en": "Few clear signals of where this is going. You can't read it from behaviour alone; a direct question is the only reliable source.", "ru": "Мало ясных сигналов о том, куда это идёт. По поведению этого не прочитать; единственный надёжный источник это прямой вопрос."}, "mid": {"en": "Mixed signals. Write down what was actually said and done, separately from what you hope or fear it means.", "ru": "Сигналы смешанные. Запиши, что реально было сказано и сделано, отдельно от того, на что ты надеешься или чего боишься."}, "high": {"en": "Things are fairly clear between you.", "ru": "Между вами довольно много ясности."}}, {"id": "cost", "en": "What the uncertainty costs me", "ru": "Чего мне стоит неопределённость", "low": {"en": "The uncertainty doesn't cost you much right now.", "ru": "Сейчас неопределённость тебе почти ничего не стоит."}, "mid": {"en": "It costs you something. Decide for yourself how long you're willing to wait, before you talk.", "ru": "Она тебе чего-то стоит. Реши для себя, сколько ты готов(а) ждать, ещё до разговора."}, "high": {"en": "The uncertainty costs you a lot. Your needs count too; asking for clarity is not pressure.", "ru": "Неопределённость дорого тебе обходится. Твои потребности тоже важны; просить ясности не значит давить."}}], "items": [{"id": "rc1", "sub": "signals", "rev": false, "en": "We make plans more than a few days ahead.", "ru": "Мы строим планы дальше, чем на пару дней вперёд."}, {"id": "rc2", "sub": "signals", "rev": false, "en": "I've met their friends, or they've met mine.", "ru": "Я знаком(а) с его/её друзьями или он(а) с моими."}, {"id": "rc3", "sub": "signals", "rev": false, "en": "We've talked about whether we see other people.", "ru": "Мы обсуждали, встречаемся ли с кем-то ещё."}, {"id": "rc4", "sub": "signals", "rev": true, "en": "When I bring up 'what are we', the topic gets changed or postponed.", "ru": "Когда я завожу разговор «кто мы друг другу», тему переводят или откладывают."}, {"id": "rc5", "sub": "cost", "rev": false, "en": "I hold back from other options while waiting for this to become clear.", "ru": "Я не рассматриваю другие варианты, пока жду ясности здесь."}, {"id": "rc6", "sub": "cost", "rev": false, "en": "I feel anxious when I don't hear from them.", "ru": "Мне тревожно, когда от него/неё нет вестей."}, {"id": "rc7", "sub": "cost", "rev": false, "en": "I pretend I'm fine with 'no labels' when I'm not.", "ru": "Я делаю вид, что меня устраивает «без ярлыков», хотя это не так."}, {"id": "rc8", "sub": "cost", "rev": false, "en": "I've thought about ending it just to stop not knowing.", "ru": "Я думал(а) закончить это, просто чтобы перестать не знать."}], "reflect": {"en": ["What do you actually want this to be?", "What answer are you afraid of, and what would you do if you heard it?", "How long are you willing to wait, and what happens after that?"], "ru": ["Чем ты на самом деле хочешь, чтобы это было?", "Какого ответа ты боишься и что сделаешь, если его услышишь?", "Сколько ты готов(а) ждать и что будет после?"]}, "links": {"en": [{"title": "Article: Not ready for a relationship but likes me", "url": "https://pairclear.com/en/mixed-signals/not-ready-but-likes-me/"}], "ru": [{"title": "Статья: мы встречаемся или нет?", "url": "https://pairclear.com/ru/status-neyasen/my-vstrechaemsya-ili-net/"}, {"title": "Тест: он вкладывается или удерживает?", "url": "https://pairclear.com/ru/tests/on-vkladyvaetsya-ili-uderzhivaet/"}]}, "validated": false, "licence": "CC BY 4.0"}, {"id": "mental-load", "version": "1.0", "title": {"en": "Who keeps track of everything: the mental load at home", "ru": "Кто всё помнит: невидимая нагрузка дома"}, "intro": {"en": "Housework is not just doing, it's also noticing, planning and reminding. These questions are about your share of each. Each partner can fill it in separately and compare.", "ru": "Домашние дела это не только сделать, но и заметить, спланировать и напомнить. Вопросы о твоей доле в каждом. Каждый партнёр может заполнить отдельно, а потом сравнить."}, "timeframe": {"en": "a typical recent month", "ru": "обычный месяц в последнее время"}, "subscales": [{"id": "load", "en": "My share of the invisible work", "ru": "Моя доля невидимой работы", "low": {"en": "The invisible work doesn't fall mainly on you.", "ru": "Невидимая работа не ложится в основном на тебя."}, "mid": {"en": "You carry a good part of it. Make a list together of what needs noticing, not just doing.", "ru": "На тебе её заметная часть. Составьте вместе список того, что нужно замечать, а не только делать."}, "high": {"en": "Most of the noticing and planning is on you. A fair split is about handing over whole areas (from noticing to doing), not single tasks.", "ru": "Почти всё замечание и планирование на тебе. Честное разделение это передача целых зон (от «заметить» до «сделать»), а не отдельных поручений."}}, {"id": "talk", "en": "Can we talk about it", "ru": "Можем ли мы об этом говорить", "low": {"en": "It's hard to raise this without a fight. Try a calm time and one concrete area, not 'you never help'.", "ru": "Это трудно поднять без ссоры. Попробуй спокойное время и одну конкретную зону, а не «ты никогда не помогаешь»."}, "mid": {"en": "Sometimes you can talk about it. What made those times work?", "ru": "Иногда об этом удаётся поговорить. Что помогло в те разы?"}, "high": {"en": "You can talk about it. That makes changing the split much easier.", "ru": "Об этом можно говорить. Это сильно облегчает перемены."}}], "items": [{"id": "ml1", "sub": "load", "rev": false, "en": "I'm the one who notices that something has run out or needs doing.", "ru": "Именно я замечаю, что что-то закончилось или нужно сделать."}, {"id": "ml2", "sub": "load", "rev": false, "en": "I keep track of appointments, birthdays and deadlines for the household.", "ru": "Я держу в голове записи к врачам, дни рождения и сроки для всей семьи."}, {"id": "ml3", "sub": "load", "rev": false, "en": "If I don't remind, it doesn't get done.", "ru": "Если я не напомню, это не будет сделано."}, {"id": "ml4", "sub": "load", "rev": false, "en": "I'm asked 'what should I buy / do?' instead of my partner working it out.", "ru": "Меня спрашивают «что купить / что сделать?», вместо того чтобы разобраться самому."}, {"id": "ml5", "sub": "load", "rev": false, "en": "I find it hard to relax at home because I see what still needs doing.", "ru": "Мне трудно расслабиться дома, потому что я вижу, что ещё нужно сделать."}, {"id": "ml6", "sub": "talk", "rev": false, "en": "When I raise the split of tasks, my partner listens.", "ru": "Когда я поднимаю тему распределения дел, партнёр слушает."}, {"id": "ml7", "sub": "talk", "rev": true, "en": "A request about chores turns into an argument.", "ru": "Просьба о домашних делах превращается в ссору."}, {"id": "ml8", "sub": "talk", "rev": false, "en": "We have agreed who owns which area at home.", "ru": "Мы договорились, кто
